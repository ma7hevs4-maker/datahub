/* ══ TAB PONTUAÇÃO DIÁRIA ══ */
function TabPontosDiario({selectedMes,pontosDaily,pontosData,processo,dark}){
  const [scope, setScope] = useState("UTS");
  const SC2 = dark ? SC_DARK : SC_LIGHT;
  const mesLabel = MN[selectedMes]||selectedMes;
  const prev = String(parseInt(selectedMes)-1);
  const polos = scope==="UTS" ? UTS : UTN;

  // all days across all polos in scope
  const allDays = useMemo(()=>{
    const s = new Set();
    for(const polo of polos)
      for(const tipo of TIPOS)
        Object.keys(pontosDaily[selectedMes]?.[polo]?.[tipo]?.[processo]||{}).forEach(d=>s.add(d));
    return [...s].sort();
  },[pontosDaily, selectedMes, scope, processo]);

  function scoreChip(val, sz="sm"){
    if(val===null||val===undefined) return <span style={{color:"var(--text5)",fontSize:sz==="sm"?11:13}}>—</span>;
    const bg = val>=80?"#16a34a":val>=68?"#d97706":"#dc2626";
    return(
      <span style={{display:"inline-block",background:bg,color:"#fff",borderRadius:4,
        padding:sz==="sm"?"2px 4px":"2px 7px",fontSize:sz==="sm"?11:13,
        fontWeight:700,minWidth:sz==="sm"?34:42,textAlign:"center"}}>
        {val.toFixed(1)}
      </span>
    );
  }

  // MTD alinhado com a aba Pontuação: usa o total mensal (soma das médias
  // de cada coluna CH..CX sobre TODAS as linhas do mês) — não a média dos
  // totais diários, que difere quando o tamanho da amostra varia por dia.
  function getMTD(polo, tipo){
    const t = pontosData?.[selectedMes]?.[polo]?.[tipo]?.[processo]?.total;
    return t==null?null:Math.round(t*10)/10;
  }
  function getPrevMTD(polo, tipo){
    const t = pontosData?.[prev]?.[polo]?.[tipo]?.[processo]?.total;
    return t==null?null:Math.round(t*10)/10;
  }

  return(
    <div className="fade" style={{display:"flex",flexDirection:"column",flex:1}}>
      {/* controls */}
      <div style={{padding:"10px 18px",background:"var(--bg1)",borderBottom:"1px solid var(--border)",
        display:"flex",gap:9,flexWrap:"wrap",alignItems:"center"}}>
        <div style={{display:"flex",gap:3,background:"var(--bg2)",borderRadius:7,padding:2}}>
          {["UTS","UTN"].map(s=>(
            <button key={s} onClick={()=>setScope(s)} style={{
              padding:"5px 18px",borderRadius:5,border:"none",cursor:"pointer",fontWeight:700,fontSize:13,
              background:scope===s?"var(--accent)":"transparent",
              color:scope===s?"#fff":"var(--text3)"}}>
              {s}
            </button>
          ))}
        </div>
        <span style={{fontSize:12,color:"var(--text3)"}}>
          Pontuação diária · <strong style={{color:"var(--text1)"}}>{mesLabel}</strong>
        </span>
        <div style={{display:"flex",gap:10,marginLeft:"auto",alignItems:"center"}}>
          {[["#16a34a","≥ 80 pts"],["#d97706","≥ 68 pts"],["#dc2626","< 68 pts"]].map(([c,l])=>(
            <div key={l} style={{display:"flex",alignItems:"center",gap:4,fontSize:10}}>
              <span style={{width:10,height:10,borderRadius:2,background:c,display:"inline-block"}}/>
              <span style={{color:"var(--text3)"}}>{l}</span>
            </div>
          ))}
          <span style={{fontSize:9,color:"#f59e0b"}}>— meta 80</span>
        </div>
      </div>

      <div style={{flex:1,overflowX:"auto",overflowY:"auto",padding:"14px 18px"}}>
        {allDays.length===0
          ?<div style={{color:"var(--text4)",textAlign:"center",padding:40,fontSize:13}}>Sem dados para {scope} · {mesLabel}</div>
          :<table style={{borderCollapse:"collapse",minWidth:700}}>
            <thead>
              <tr style={{background:"var(--bg2)"}}>
                <th style={{padding:"7px 10px",textAlign:"left",fontSize:11,color:"var(--text3)",fontWeight:700,
                  position:"sticky",left:0,background:"var(--bg2)",borderBottom:"1px solid var(--border)",
                  minWidth:100,zIndex:3}}>Polo</th>
                <th style={{padding:"7px 8px",textAlign:"center",fontSize:11,color:"var(--text3)",fontWeight:700,
                  position:"sticky",left:100,background:"var(--bg2)",borderBottom:"1px solid var(--border)",
                  minWidth:90,zIndex:3}}>Tipo</th>
                <th style={{padding:"7px 7px",textAlign:"center",fontSize:11,color:"var(--out-t)",fontWeight:700,
                  minWidth:52,borderBottom:"1px solid var(--border)"}}>{MN[prev]||"—"}</th>
                {allDays.map(d=>{
                  const day=parseInt(d.split("-")[2]);
                  const wd=new Date(d+"T12:00:00").toLocaleDateString("pt-BR",{weekday:"short"}).replace(".","");
                  return(
                    <th key={d} style={{padding:"4px 2px",textAlign:"center",fontSize:9,
                      color:"var(--text3)",fontWeight:600,minWidth:38,borderBottom:"1px solid var(--border)"}}>
                      <div style={{fontSize:8,color:"var(--text4)"}}>{wd}</div>
                      <div>{day}</div>
                    </th>
                  );
                })}
                <th style={{padding:"7px 7px",textAlign:"center",fontSize:11,color:"#22d3ee",
                  fontWeight:700,minWidth:58,borderBottom:"1px solid var(--border)"}}>
                  MTD {mesLabel}
                </th>
              </tr>
            </thead>
            <tbody>
              {polos.map((polo,pi)=>
                TIPOS.map((tipo,ti)=>{
                  const daily = pontosDaily[selectedMes]?.[polo]?.[tipo]?.[processo]||{};
                  const mtd = getMTD(polo, tipo);
                  const prevMTD = getPrevMTD(polo, tipo);
                  const diff = (mtd!=null&&prevMTD!=null)?mtd-prevMTD:null;
                  const isIns = tipo==="Insourcing";
                  const isFirstTipo = ti===0;
                  const bg = pi%2===0?"var(--bg0)":"var(--bg1)";
                  const tipoBg = isIns?(dark?"#1e3a8a18":"#dbeafe44"):(dark?"#4c1d9518":"#ede9fe44");
                  return(
                    <tr key={`${polo}-${tipo}`} style={{
                      background: isFirstTipo ? bg : tipoBg,
                      borderTop: isFirstTipo&&pi>0 ? "2px solid var(--border2)" : "none"
                    }}>
                      {/* POLO — rowspan 2 */}
                      {isFirstTipo&&(
                        <td rowSpan={2} style={{padding:"6px 10px",fontWeight:700,fontSize:13,
                          color:"var(--text1)",background:bg,border:"1px solid var(--border)",
                          borderTop:pi>0?"2px solid var(--border2)":"",
                          position:"sticky",left:0,zIndex:2,verticalAlign:"middle",textAlign:"center"}}>
                          {polo}
                        </td>
                      )}
                      {/* TIPO */}
                      <td style={{padding:"5px 8px",fontWeight:700,fontSize:12,
                        color:isIns?"var(--ins-t)":"var(--out-t)",
                        background:tipoBg,border:"1px solid var(--border)",
                        position:"sticky",left:100,zIndex:2,whiteSpace:"nowrap",textAlign:"center"}}>
                        {tipo}
                      </td>
                      {/* PREV MTD */}
                      <td style={{padding:"4px 4px",textAlign:"center",border:"1px solid var(--border)"}}>
                        {scoreChip(prevMTD)}
                      </td>
                      {/* DAILY */}
                      {allDays.map(d=>(
                        <td key={d} style={{padding:"3px 2px",textAlign:"center",border:"1px solid var(--border)"}}>
                          {scoreChip(daily[d]??null)}
                        </td>
                      ))}
                      {/* MTD */}
                      <td style={{padding:"4px 5px",textAlign:"center",border:"2px solid var(--border2)",
                        background:"var(--bg2)"}}>
                        <div>{scoreChip(mtd,"md")}</div>
                        {diff!=null&&<div style={{fontSize:9,color:diff>0?"#22c55e":"#f87171",fontWeight:600,marginTop:2}}>
                          {diff>0?"+":""}{diff.toFixed(1)} vs {MN[prev]||prev}
                        </div>}
                      </td>
                    </tr>
                  );
                })
              )}
            </tbody>
          </table>
        }
      </div>
    </div>
  );
}


/* ══ TAB RESUMO SEMANAL ══ */
function TabSemanal({selectedMes, semanalData, metas, pontosData, processo, dark}){
  const [scope, setScope] = useState("UTS");
  const [viewMode, setViewMode] = useState("ut");
  const [selPolo, setSelPolo] = useState("Niterói");
  const SC2 = dark ? SC_DARK : SC_LIGHT;
  const mesLabel = MN[selectedMes]||selectedMes;
  const polos = scope==="UTS" ? UTS : UTN;

  const weeks = useMemo(()=>{
    const ws = new Set();
    const checkPolos = viewMode==="polo" ? [selPolo] : polos;
    for(const polo of checkPolos)
      for(const tipo of TIPOS)
        Object.keys(semanalData[selectedMes]?.[polo]?.[tipo]?.[processo]||{}).forEach(w=>ws.add(w));
    return [...ws].sort((a,b)=>parseInt(a)-parseInt(b));
  },[semanalData, selectedMes, scope, viewMode, selPolo]);

  function weekDateRange(wk){
    for(const polo of [...UTS,...UTN])
      for(const tipo of TIPOS){
        const w = semanalData[selectedMes]?.[polo]?.[tipo]?.[processo]?.[wk];
        if(w?.d_ini) return `${w.d_ini.slice(5)} – ${w.d_fim.slice(5)}`;
      }
    return "";
  }

  function getAggWeekVal(tipo, wk, key){
    const vals = [];
    for(const polo of polos){
      const v = semanalData[selectedMes]?.[polo]?.[tipo]?.[processo]?.[wk]?.[key];
      if(v!=null) vals.push(v);
    }
    return vals.length ? Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*10)/10 : null;
  }
  function getPoloWeekVal(polo, tipo, wk, key){
    return semanalData[selectedMes]?.[polo]?.[tipo]?.[processo]?.[wk]?.[key]??null;
  }
  function getMTDPontos(polo, tipo){
    return pontosData[selectedMes]?.[polo]?.[tipo]?.[processo]?.total??null;
  }

  // ── Shared chart: barras por semana (Ins=azul, Out=roxo) + linha meta ──
  function SemChart({kpiKey, getVal, meta, label, unit, dark}){
    const TCOL={Insourcing:"#3b82f6",Outsourcing:"#a855f7"};
    const allVals=[...weeks.flatMap(wk=>TIPOS.map(t=>getVal(t,wk)).filter(v=>v!=null)),meta];
    const maxV=Math.max(...allVals)*1.15||1;
    const W=500,H=155,PL=32,PR=36,PT=14,PB=40;
    const cW=W-PL-PR,cH=H-PT-PB;
    const toY=v=>PT+cH-(Math.max(0,v/maxV)*cH);
    const metaY=toY(meta);
    const n=weeks.length;
    const grpW=cW/n;
    const barW=Math.min(26,grpW*0.34);
    const gridColor=dark?"#1a2e4a":"#e2eaf5";
    const lblColor=dark?"#2d5a8e":"#94adc8";
    const wkColor=dark?"#4b7ba8":"#64748b";
    return(
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",maxWidth:W,display:"block"}}>
        {[0,.25,.5,.75,1].map(f=>{
          const yy=PT+cH*(1-f);
          return<g key={f}>
            <line x1={PL} y1={yy} x2={W-PR} y2={yy} stroke={gridColor} strokeWidth={0.7}/>
            <text x={PL-3} y={yy+3} textAnchor="end" fontSize={8} fill={lblColor}>{(maxV*f).toFixed(1)}</text>
          </g>;
        })}
        <line x1={PL} y1={metaY} x2={W-PR} y2={metaY}
          stroke="#f59e0b" strokeWidth={1.5} strokeDasharray="5,3" opacity={0.9}/>
        <text x={W-PR+2} y={metaY+3} fontSize={8} fill="#f59e0b" fontWeight="600">Meta</text>
        {weeks.map((wk,wi)=>{
          const cx=PL+wi*grpW+grpW/2;
          return<g key={wk}>
            {TIPOS.map((tipo,ti)=>{
              const val=getVal(tipo,wk);
              if(val===null)return null;
              const x=cx+(ti===0?-barW-1:1);
              const y=toY(val);
              const bh=Math.max(1,toY(0)-y);
              const bc=TCOL[tipo];
              return<g key={tipo}>
                <rect x={x} y={y} width={barW} height={bh} fill={bc} opacity={0.88} rx={2}/>
                <text x={x+barW/2} y={y-2} textAnchor="middle" fontSize={7} fill={bc} fontWeight="bold">{val.toFixed(1)}</text>
              </g>;
            })}
            <text x={cx} y={H-PB+13} textAnchor="middle" fontSize={9} fill={wkColor}>Sem{wk}</text>
            <text x={cx} y={H-PB+23} textAnchor="middle" fontSize={7} fill={lblColor}>{weekDateRange(wk)}</text>
          </g>;
        })}
        {TIPOS.map((tipo,ti)=>(
          <g key={tipo} transform={`translate(${PL+ti*95},${H-PB+32})`}>
            <rect width={10} height={10} fill={TCOL[tipo]} rx={2} opacity={0.85}/>
            <text x={13} y={8.5} fontSize={8.5} fill={dark?"#7db8e8":"#2d5a8e"}>{tipo}</text>
          </g>
        ))}
      </svg>
    );
  }

  // Score chart: verde/laranja/vermelho por pontuação
  function ScoreChart({getVal, dark}){
    const TCOL={Insourcing:"#3b82f6",Outsourcing:"#a855f7"};
    const meta=80;
    const allVals=[...weeks.flatMap(wk=>TIPOS.map(t=>getVal(t,wk)).filter(v=>v!=null)),meta];
    const maxV=Math.max(...allVals)*1.15||100;
    const W=500,H=155,PL=32,PR=36,PT=14,PB=40;
    const cW=W-PL-PR,cH=H-PT-PB;
    const toY=v=>PT+cH-(Math.max(0,v/maxV)*cH);
    const metaY=toY(meta);
    const n=weeks.length;
    const grpW=cW/n;
    const barW=Math.min(26,grpW*0.34);
    const gridColor=dark?"#1a2e4a":"#e2eaf5";
    const lblColor=dark?"#2d5a8e":"#94adc8";
    const wkColor=dark?"#4b7ba8":"#64748b";
    return(
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",maxWidth:W,display:"block"}}>
        {[0,.25,.5,.75,1].map(f=>{
          const yy=PT+cH*(1-f);
          return<g key={f}>
            <line x1={PL} y1={yy} x2={W-PR} y2={yy} stroke={gridColor} strokeWidth={0.7}/>
            <text x={PL-3} y={yy+3} textAnchor="end" fontSize={8} fill={lblColor}>{(maxV*f).toFixed(0)}</text>
          </g>;
        })}
        <line x1={PL} y1={metaY} x2={W-PR} y2={metaY}
          stroke="#f59e0b" strokeWidth={1.5} strokeDasharray="5,3" opacity={0.9}/>
        <text x={W-PR+2} y={metaY+3} fontSize={8} fill="#f59e0b" fontWeight="600">80</text>
        {weeks.map((wk,wi)=>{
          const cx=PL+wi*grpW+grpW/2;
          return<g key={wk}>
            {TIPOS.map((tipo,ti)=>{
              const val=getVal(tipo,wk);
              if(val===null)return null;
              const x=cx+(ti===0?-barW-1:1);
              const y=toY(val);
              const bh=Math.max(1,toY(0)-y);
              const bc=TCOL[tipo];
              return<g key={tipo}>
                <rect x={x} y={y} width={barW} height={bh} fill={bc} opacity={0.88} rx={2}/>
                <text x={x+barW/2} y={y-2} textAnchor="middle" fontSize={7} fill={bc} fontWeight="bold">{val.toFixed(1)}</text>
              </g>;
            })}
            <text x={cx} y={H-PB+13} textAnchor="middle" fontSize={9} fill={wkColor}>Sem{wk}</text>
            <text x={cx} y={H-PB+23} textAnchor="middle" fontSize={7} fill={lblColor}>{weekDateRange(wk)}</text>
          </g>;
        })}
        {TIPOS.map((tipo,ti)=>(
          <g key={tipo} transform={`translate(${PL+ti*95},${H-PB+32})`}>
            <rect width={10} height={10} fill={TCOL[tipo]} rx={2} opacity={0.85}/>
            <text x={13} y={8.5} fontSize={8.5} fill={dark?"#7db8e8":"#2d5a8e"}>{tipo}</text>
          </g>
        ))}
      </svg>
    );
  }

  function KpiChip({val, meta, k}){ return <Chip val={val} meta={meta} k={k} dark={dark}/>; }
  function ScChip({val}){
    if(val===null||val===undefined) return <span style={{color:"var(--text5)",fontSize:11}}>—</span>;
    const bg=val>=80?"#16a34a":val>=68?"#d97706":"#dc2626";
    return <span style={{display:"inline-block",background:bg,color:"#fff",borderRadius:4,
      padding:"2px 5px",fontSize:11,fontWeight:700,minWidth:36,textAlign:"center"}}>{val.toFixed(1)}</span>;
  }

  // ── Section header ──
  function SectionHead({label}){
    return(
      <div style={{fontSize:12,fontWeight:700,color:"var(--text2)",marginBottom:10,
        padding:"6px 12px",background:"var(--bg2)",borderRadius:8,display:"inline-block"}}>
        {label}
      </div>
    );
  }

  // ── KPI table ──
  function KpiTable({getVal, weeks: wks}){
    return(
      <div style={{overflowX:"auto",marginBottom:8}}>
        <table style={{borderCollapse:"collapse",width:"100%"}}>
          <thead>
            <tr style={{background:"var(--bg2)"}}>
              <th style={{padding:"6px 12px",textAlign:"left",fontSize:11,color:"var(--text3)",fontWeight:700,
                position:"sticky",left:0,background:"var(--bg2)",borderBottom:"1px solid var(--border)",minWidth:110}}>KPI</th>
              <th style={{padding:"6px 7px",textAlign:"center",fontSize:11,color:"var(--meta)",fontWeight:700,
                minWidth:46,borderBottom:"1px solid var(--border)"}}>META</th>
              {TIPOS.map(tipo=>(
                <th key={tipo} colSpan={wks.length} style={{padding:"5px 4px",textAlign:"center",
                  fontSize:11,fontWeight:700,borderLeft:"2px solid var(--border2)",
                  borderBottom:"1px solid var(--border)",
                  color:tipo==="Insourcing"?"var(--ins-t)":"var(--out-t)"}}>
                  {tipo}
                </th>
              ))}
            </tr>
            <tr style={{background:"var(--bg1)"}}>
              <th style={{position:"sticky",left:0,background:"var(--bg1)"}}/><th/>
              {TIPOS.map(tipo=>wks.map(wk=>(
                <th key={`${tipo}-${wk}`} style={{padding:"3px 4px",textAlign:"center",fontSize:9,
                  color:"var(--text3)",fontWeight:600,minWidth:80,
                  borderLeft:wk===wks[0]?"2px solid var(--border2)":"1px solid var(--border)",
                  borderBottom:"1px solid var(--border)"}}>
                  <div style={{fontWeight:700,color:"var(--text2)"}}>Sem {wk}</div>
                  <div style={{fontSize:8,color:"var(--text4)"}}>{weekDateRange(wk)}</div>
                </th>
              )))}
            </tr>
          </thead>
          <tbody>
            {KPI_KEYS.map((k,ki)=>{
              const meta=metas[k];
              const bg=ki%2===0?"var(--bg0)":"var(--bg1)";
              return(
                <tr key={k} style={{background:bg}}>
                  <td style={{padding:"5px 12px",fontSize:12,fontWeight:600,color:"var(--text1)",
                    background:bg,border:"1px solid var(--border)",position:"sticky",left:0,whiteSpace:"nowrap"}}>
                    {KPI_LBL[k]}<span style={{fontSize:9,color:"var(--text4)",marginLeft:3}}>{KPI_UNIT[k]}</span>
                  </td>
                  <td style={{padding:"4px 6px",textAlign:"center",border:"1px solid var(--border)"}}>
                    <span style={{color:"var(--meta)",fontWeight:700,fontSize:12}}>{meta}</span>
                  </td>
                  {TIPOS.map(tipo=>wks.map((wk,wi)=>(
                    <td key={`${tipo}-${wk}`} style={{padding:"4px 3px",textAlign:"center",
                      borderLeft:wi===0?"2px solid var(--border2)":"1px solid var(--border)",
                      borderTop:"1px solid var(--border)"}}>
                      <KpiChip val={getVal(tipo,wk,k)} meta={meta} k={k}/>
                    </td>
                  )))}
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    );
  }

  // ── Pontuação table ──
  function PontosTable({polosArr, getVal, getValMTD, weeks: wks}){
    return(
      <div style={{overflowX:"auto",marginBottom:8}}>
        <table style={{borderCollapse:"collapse",width:"100%"}}>
          <thead>
            <tr style={{background:"var(--bg2)"}}>
              <th style={{padding:"6px 10px",textAlign:"left",fontSize:11,color:"var(--text3)",fontWeight:700,
                position:"sticky",left:0,background:"var(--bg2)",borderBottom:"1px solid var(--border)",minWidth:110}}>Polo</th>
              <th style={{padding:"6px 8px",textAlign:"center",fontSize:11,color:"var(--text3)",fontWeight:700,
                minWidth:86,borderBottom:"1px solid var(--border)"}}>Tipo</th>
              {wks.map(wk=>(
                <th key={wk} style={{padding:"4px 6px",textAlign:"center",fontSize:10,
                  color:"var(--accent)",fontWeight:700,minWidth:80,
                  borderLeft:"1px solid var(--border)",borderBottom:"1px solid var(--border)"}}>
                  <div>Sem {wk}</div>
                  <div style={{fontSize:8,color:"var(--text4)"}}>{weekDateRange(wk)}</div>
                </th>
              ))}
              <th style={{padding:"6px 7px",textAlign:"center",fontSize:11,color:"#22d3ee",
                fontWeight:700,minWidth:60,borderBottom:"1px solid var(--border)"}}>MTD</th>
            </tr>
          </thead>
          <tbody>
            {polosArr.map((polo,pi)=>
              TIPOS.map((tipo,ti)=>{
                const isIns=tipo==="Insourcing";
                const bg=pi%2===0?"var(--bg0)":"var(--bg1)";
                const tipoBg=isIns?(dark?"#1e3a8a18":"#dbeafe44"):(dark?"#4c1d9518":"#ede9fe44");
                return(
                  <tr key={`${polo}-${tipo}`} style={{
                    background:ti===0?bg:tipoBg,
                    borderTop:ti===0&&pi>0?"2px solid var(--border2)":"none"}}>
                    {ti===0&&(
                      <td rowSpan={2} style={{padding:"5px 10px",fontWeight:700,fontSize:13,
                        color:"var(--text1)",background:bg,border:"1px solid var(--border)",
                        borderTop:pi>0?"2px solid var(--border2)":"",
                        position:"sticky",left:0,zIndex:2,verticalAlign:"middle",textAlign:"center"}}>
                        {polo}
                      </td>
                    )}
                    <td style={{padding:"4px 8px",fontWeight:700,fontSize:11,
                      color:isIns?"var(--ins-t)":"var(--out-t)",
                      background:tipoBg,border:"1px solid var(--border)",textAlign:"center",whiteSpace:"nowrap"}}>
                      {tipo}
                    </td>
                    {wks.map(wk=>(
                      <td key={wk} style={{padding:"4px 3px",textAlign:"center",
                        borderLeft:"1px solid var(--border)",borderTop:"1px solid var(--border)"}}>
                        <ScChip val={getVal(polo,tipo,wk)}/>
                      </td>
                    ))}
                    <td style={{padding:"4px 5px",textAlign:"center",
                      border:"1px solid var(--border)",background:"var(--bg2)"}}>
                      <ScChip val={getValMTD(polo,tipo)}/>
                    </td>
                  </tr>
                );
              })
            )}
          </tbody>
        </table>
      </div>
    );
  }

  // ── KPI charts grid ──
  function KpiCharts({getVal}){
    return(
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(480px,1fr))",gap:13,marginBottom:8}}>
        {KPI_KEYS.map(k=>(
          <div key={k} style={{background:"var(--bg1)",border:"1px solid var(--border)",borderRadius:12,padding:"13px 15px"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
              <span style={{fontWeight:700,fontSize:13,color:"var(--text1)"}}>
                {KPI_LBL[k]}<span style={{fontSize:10,color:"var(--text4)",marginLeft:5}}>{KPI_UNIT[k]}</span>
              </span>
              <span style={{fontSize:10,color:"var(--meta)"}}>Meta: {metas[k]} {KPI_UNIT[k]}</span>
            </div>
            <SemChart kpiKey={k} getVal={(tipo,wk)=>getVal(tipo,wk,k)}
              meta={metas[k]} label={KPI_LBL[k]} unit={KPI_UNIT[k]} dark={dark}/>
          </div>
        ))}
      </div>
    );
  }

  // ── Score chart panel ──
  function ScoreChartPanel({getVal}){
    return(
      <div style={{background:"var(--bg1)",border:"1px solid var(--border)",borderRadius:12,padding:"13px 15px",marginBottom:8}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <span style={{fontWeight:700,fontSize:13,color:"var(--text1)"}}>🏆 Pontuação Média</span>
          <span style={{fontSize:10,color:"#f59e0b"}}>Meta: 80 pts</span>
        </div>
        <ScoreChart getVal={getVal} dark={dark}/>
      </div>
    );
  }

  // ── VIEW: por UT ──
  function ViewUT(){
    const aggKpi=(tipo,wk,k)=>getAggWeekVal(tipo,wk,k);
    const aggPts=(tipo,wk)=>getAggWeekVal(tipo,wk,'pontos');
    const aggPtsMTD=(polo,tipo)=>getMTDPontos(polo,tipo);
    return(
      <div>
        <SectionHead label={`📊 KPIs de Performance · ${scope} · ${mesLabel}`}/>
        <KpiTable getVal={aggKpi} weeks={weeks}/>
        <KpiCharts getVal={aggKpi}/>
        <SectionHead label={`🏆 Pontuação das Equipes · ${scope} · ${mesLabel}`}/>
        <ScoreChartPanel getVal={aggPts}/>
        <PontosTable polosArr={polos}
          getVal={(polo,tipo,wk)=>getPoloWeekVal(polo,tipo,wk,'pontos')}
          getValMTD={aggPtsMTD} weeks={weeks}/>
      </div>
    );
  }

  // ── VIEW: por polo ──
  function ViewPolo(){
    const weeks_polo=[...new Set(
      TIPOS.flatMap(tipo=>Object.keys(semanalData[selectedMes]?.[selPolo]?.[tipo]||{}))
    )].sort((a,b)=>parseInt(a)-parseInt(b));
    const poloKpi=(tipo,wk,k)=>getPoloWeekVal(selPolo,tipo,wk,k);
    const poloPts=(tipo,wk)=>getPoloWeekVal(selPolo,tipo,wk,'pontos');
    return(
      <div>
        <SectionHead label={`📊 KPIs · ${selPolo} · ${mesLabel}`}/>
        <KpiTable getVal={poloKpi} weeks={weeks_polo}/>
        <KpiCharts getVal={poloKpi}/>
        <SectionHead label={`🏆 Pontuação · ${selPolo} · ${mesLabel}`}/>
        <ScoreChartPanel getVal={poloPts}/>
        <PontosTable polosArr={[selPolo]}
          getVal={(polo,tipo,wk)=>getPoloWeekVal(polo,tipo,wk,'pontos')}
          getValMTD={(polo,tipo)=>getMTDPontos(polo,tipo)} weeks={weeks_polo}/>
      </div>
    );
  }

  return(
    <div className="fade" style={{display:"flex",flexDirection:"column",flex:1}}>
      <div style={{padding:"10px 18px",background:"var(--bg1)",borderBottom:"1px solid var(--border)",
        display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
        <div style={{display:"flex",gap:3,background:"var(--bg2)",borderRadius:7,padding:2}}>
          {["UTS","UTN"].map(s=>(
            <button key={s} onClick={()=>{setScope(s);setViewMode("ut");}} style={{
              padding:"5px 16px",borderRadius:5,border:"none",cursor:"pointer",fontWeight:700,fontSize:13,
              background:scope===s&&viewMode==="ut"?"var(--accent)":"transparent",
              color:scope===s&&viewMode==="ut"?"#fff":"var(--text3)"}}>
              {s}
            </button>
          ))}
        </div>
        <span style={{color:"var(--text5)"}}>|</span>
        {[...UTS,...UTN].map(p=>{
          const active=viewMode==="polo"&&selPolo===p;
          const hasData=Object.keys(semanalData[selectedMes]?.[p]||{}).length>0;
          return(
            <button key={p} onClick={()=>{setViewMode("polo");setSelPolo(p);
              setScope(UTS.includes(p)?"UTS":"UTN");}} style={{
              padding:"4px 12px",borderRadius:20,
              border:`1px solid ${active?"var(--accent)":"var(--border)"}`,
              cursor:hasData?"pointer":"default",fontWeight:600,fontSize:12,
              background:active?"var(--accent)":"var(--tag-bg)",
              color:active?"#fff":hasData?"var(--text3)":"var(--text5)",
              opacity:hasData?1:0.4}}>
              {p==="São Gonçalo"?"S.Gonçalo":p}
            </button>
          );
        })}
        <span style={{fontSize:11,color:"var(--text4)",marginLeft:4}}>
          <strong style={{color:"var(--text1)"}}>{mesLabel}</strong>
        </span>
      </div>
      <div style={{flex:1,overflowX:"auto",overflowY:"auto",padding:"14px 18px"}}>
        {viewMode==="ut" ? <ViewUT/> : <ViewPolo/>}
      </div>
    </div>
  );
}


/* ══ APP ══ */
function App(){
  const [kpiData,setKpiData]=useState(EMBEDDED);
  const [pontosData,setPontosData]=useState(PONTOS_DATA);
  const [pontosDaily,setPontosDaily]=useState(PONTOS_DAILY);
  const [semanalData,setSemanalData]=useState(SEMANAL_DATA);
  const [uploadMsg,setUploadMsg]=useState("");
  const [uploading,setUploading]=useState(false);
  const [metas,setMetas]=useState(DEF_META);
  const [showMetas,setShowMetas]=useState(false);
  const [tmpMetas,setTmpMetas]=useState(DEF_META);
  const [tab,setTab]=useState("painel");
  const [selectedMes,setSelectedMes]=useState("");
  const [selectedUT,setSelectedUT]=useState("UTS");
  const [processo,setProcesso]=useState("Op+Extra");
  const [dark,setDark]=useState(true);
  const [allDates,setAllDates]=useState([]);
  const [selDays,setSelDays]=useState([]);
  const fileRef=useRef();
  const wbRef=useRef(null);

  const toggleTheme=useCallback(()=>{
    setDark(d=>{
      document.body.className=d?"light":"dark";
      return!d;
    });
  },[]);

  const mesesDisp=useMemo(()=>Object.keys(kpiData).sort((a,b)=>parseInt(a)-parseInt(b)),[kpiData]);
  const hasData=mesesDisp.length>0;

  useEffect(()=>{
    if(mesesDisp.length && !mesesDisp.includes(selectedMes)){
      setSelectedMes(mesesDisp[mesesDisp.length-1]);
    }
  },[mesesDisp,selectedMes]);

  const applyParsed=useCallback((parsed)=>{
    setKpiData(parsed.kpi||{});
    setPontosData(parsed.pontos||{});
    setPontosDaily(parsed.pontosDaily||{});
    setSemanalData(parsed.semanalData||{});
  },[]);

  // re-processa a base quando o filtro de dias muda (afeta todas as abas)
  useEffect(()=>{
    if(!wbRef.current) return;
    const parsed=parseXLSX(wbRef.current, selDays);
    if(!parsed){
      setKpiData({});setPontosData({});setPontosDaily({});setSemanalData({});
      setUploadMsg("⚠️ Nenhum dado para os dias selecionados.");
    }else{
      applyParsed(parsed);
    }
  },[selDays,applyParsed]);

  const handleFile=useCallback(async(e)=>{
    const file=e.target.files[0];if(!file)return;
    setUploading(true);setUploadMsg("Lendo planilha...");
    try{
      const buf=await file.arrayBuffer();
      const wb=XLSX.read(buf,{type:"array",cellDates:true});
      setUploadMsg("Processando dados...");
      await new Promise(r=>setTimeout(r,60));
      const parsed=parseXLSX(wb);
      if(!parsed||!Object.keys(parsed.kpi||{}).length){
        setUploadMsg("❌ Não foi possível ler os dados. Verifique a planilha.");
      }else{
        wbRef.current=wb;
        setSelDays([]);
        setAllDates(parsed.allDates||[]);
        setKpiData(parsed.kpi);
        if(parsed.pontos&&Object.keys(parsed.pontos).length) setPontosData(parsed.pontos);
        if(parsed.pontosDaily&&Object.keys(parsed.pontosDaily).length) setPontosDaily(parsed.pontosDaily);
        if(parsed.semanalData&&Object.keys(parsed.semanalData).length) setSemanalData(parsed.semanalData);
        const ms=Object.keys(parsed.kpi).sort((a,b)=>parseInt(a)-parseInt(b));
        setSelectedMes(ms[ms.length-1]);
        setUploadMsg(`✅ ${file.name} — ${ms.length} mês(es): ${ms.map(m=>MN[m]||m).join(", ")}`);
      }
    }catch(err){setUploadMsg("❌ Erro: "+err.message);}
    setUploading(false);e.target.value="";
  },[]);

  return(
    <div style={{minHeight:"100vh",display:"flex",flexDirection:"column"}}>
      {/* TOP BAR */}
      <div style={{background:"var(--bg2)",borderBottom:"1px solid var(--border)",
        padding:"12px 18px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:9}}>
        <div style={{display:"flex",alignItems:"center",gap:11}}>
          <div style={{width:35,height:35,borderRadius:9,background:"linear-gradient(135deg,#1d4ed8,#0ea5e9)",
            display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>⚡</div>
          <div>
            <div style={{fontWeight:700,fontSize:15,color:"var(--text0)",letterSpacing:"-.3px"}}>Scanner 4.0 · Performance RJ</div>
            <div style={{fontSize:11,color:"var(--text3)",fontFamily:"'IBM Plex Mono',monospace"}}>
              {mesesDisp.map(m=>MN[m]||m).join(" · ")}
            </div>
          </div>
        </div>
        <div style={{display:"flex",gap:7,alignItems:"center",flexWrap:"wrap"}}>
          <label style={{display:"flex",alignItems:"center",gap:5,cursor:"pointer",
            background:"var(--tag-bg)",border:"1px dashed var(--border2)",borderRadius:8,
            padding:"5px 12px",fontSize:12,color:"var(--text2)"}}>
            {uploading?"⏳ Processando...":"📂 Carregar Base (.xlsx)"}
            <input ref={fileRef} type="file" accept=".xlsx,.xlsm,.xls" onChange={handleFile} style={{display:"none"}}/>
          </label>
          {(tab==="painel"||tab==="evolucao")&&(
            <div style={{display:"flex",gap:3,background:"var(--tag-bg)",borderRadius:7,padding:2}}>
              {["UTS","UTN"].map(ut=>(
                <button key={ut} onClick={()=>setSelectedUT(ut)} style={{
                  padding:"4px 13px",borderRadius:5,border:"none",cursor:"pointer",fontWeight:700,fontSize:12,
                  background:selectedUT===ut?"var(--accent)":"transparent",
                  color:selectedUT===ut?"#fff":"var(--text3)"}}>
                  {ut}
                </button>
              ))}
            </div>
          )}
          {(tab==="painel"||tab==="diario"||tab==="comparativo"||tab==="report"||tab==="pontos"||tab==="pontos_dia"||tab==="semanal")&&(
            <select value={selectedMes} onChange={e=>setSelectedMes(e.target.value)}
              style={{background:"var(--tag-bg)",color:"var(--text0)",border:"1px solid var(--border2)",
                borderRadius:7,padding:"5px 10px",fontSize:13,cursor:"pointer"}}>
              {mesesDisp.map(m=><option key={m} value={m}>{MN[m]||m}</option>)}
            </select>
          )}
          {(tab==="painel"||tab==="diario"||tab==="comparativo"||tab==="report"||tab==="pontos"||tab==="pontos_dia"||tab==="semanal")&&(
            <DiasFilter allDates={allDates} selectedMes={selectedMes} value={selDays} onChange={setSelDays}/>
          )}
          <button onClick={()=>{setTmpMetas({...metas});setShowMetas(true);}}
            style={{padding:"5px 12px",borderRadius:7,border:"1px solid var(--border2)",
              background:"var(--tag-bg)",color:"var(--text2)",cursor:"pointer",fontSize:12,fontWeight:600}}>
            ⚙️ Metas
          </button>
          <ThemeToggle dark={dark} onToggle={toggleTheme}/>
        </div>
      </div>

      {/* upload msg */}
      {uploadMsg&&(
        <div style={{background:"var(--bg1)",borderBottom:"1px solid var(--border)",
          padding:"6px 18px",fontSize:12,color:uploadMsg.includes("❌")?"#f87171":"#4ade80",
          display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          {uploadMsg}
          <button onClick={()=>setUploadMsg("")} style={{color:"var(--text4)",background:"none",border:"none",cursor:"pointer",fontSize:13}}>✕</button>
        </div>
      )}

      {/* PROCESSO FILTER — sempre visível */}
      <div style={{background:"var(--bg1)",borderBottom:"1px solid var(--border)",padding:"8px 18px"}}>
        <ProcessoFilter value={processo} onChange={setProcesso}/>
      </div>

      {/* TABS */}
      <div style={{background:"var(--bg2)",borderBottom:"1px solid var(--border)",padding:"0 18px",display:"flex",gap:0}}>
        {[["painel","🗺 Painel por UT"],["comparativo","📊 Comparativo Polos"],["evolucao","📈 Evolução Mensal"],["diario","📅 Resumo Diário"],["report","📋 Report Diário"],["pontos","🏆 Pontuação"],["pontos_dia","📈 Pont. Diária"],["semanal","📆 Resumo Semanal"]].map(([id,lbl])=>(
          <button key={id} onClick={()=>setTab(id)} style={{
            padding:"10px 17px",border:"none",background:"transparent",cursor:"pointer",
            fontSize:13,fontWeight:600,color:tab===id?"var(--accent)":"var(--text3)",
            borderBottom:tab===id?"2px solid var(--accent)":"2px solid transparent"}}>
            {lbl}
          </button>
        ))}
      </div>

      {!hasData ? (
        <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",padding:"60px 20px"}}>
          <div style={{textAlign:"center",maxWidth:480}}>
            <div style={{fontSize:48,marginBottom:12}}>📊</div>
            <div style={{fontSize:18,fontWeight:700,color:"var(--text1)",marginBottom:8}}>Nenhuma base carregada</div>
            <div style={{fontSize:13,color:"var(--text3)",lineHeight:1.6}}>
              Clique em <strong style={{color:"var(--text1)"}}>📂 Carregar Base (.xlsx)</strong> no topo da página para importar sua planilha e visualizar os indicadores.
            </div>
          </div>
        </div>
      ) : (<>
      {tab==="painel"&&<TabPainel kpiData={kpiData} metas={metas} selectedUT={selectedUT} selectedMes={selectedMes} processo={processo} dark={dark}/>}
      {tab==="comparativo"&&<TabComparativo kpiData={kpiData} metas={metas} selectedMes={selectedMes} processo={processo} dark={dark}/>}
      {tab==="evolucao"&&<TabEvolucao kpiData={kpiData} metas={metas} selectedUT={selectedUT} processo={processo} dark={dark} pontosData={pontosData}/>}
      {tab==="diario"&&<TabDiario kpiData={kpiData} metas={metas} selectedMes={selectedMes} processo={processo} dark={dark}/>}
      {tab==="report"&&<TabReport kpiData={kpiData} metas={metas} selectedMes={selectedMes} processo={processo} dark={dark}/>}
      {tab==="pontos"&&<TabPontos pontosData={pontosData} selectedMes={selectedMes} processo={processo} dark={dark}/>}
      {tab==="pontos_dia"&&<TabPontosDiario selectedMes={selectedMes} pontosDaily={pontosDaily} pontosData={pontosData} processo={processo} dark={dark}/>}
      {tab==="semanal"&&<TabSemanal selectedMes={selectedMes} semanalData={semanalData} metas={metas} pontosData={pontosData} processo={processo} dark={dark}/>}
      </>)}

      {/* MODAL METAS */}
      {showMetas&&(
        <div style={{position:"fixed",inset:0,background:"#00000099",display:"flex",
          alignItems:"center",justifyContent:"center",zIndex:200}} onClick={()=>setShowMetas(false)}>
          <div style={{background:"var(--bg1)",border:"1px solid var(--border)",borderRadius:16,
            padding:24,minWidth:340,maxWidth:420}} onClick={e=>e.stopPropagation()}>
            <div style={{fontWeight:700,fontSize:15,color:"var(--text1)",marginBottom:16}}>⚙️ Configurar Metas</div>
            {KPI_KEYS.map(k=>(
              <div key={k} style={{marginBottom:12}}>
                <label style={{fontSize:12,color:"var(--text2)",fontWeight:600,display:"block",marginBottom:3}}>
                  {KPI_LBL[k]} ({KPI_UNIT[k]})</label>
                <input type="number" step="0.1" value={tmpMetas[k]}
                  onChange={e=>setTmpMetas(p=>({...p,[k]:parseFloat(e.target.value)||0}))}
                  style={{width:"100%",background:"var(--bg0)",border:"1px solid var(--border)",
                    color:"var(--text0)",borderRadius:8,padding:"7px 12px",fontSize:14}}/>
              </div>
            ))}
            <div style={{display:"flex",gap:8,marginTop:16}}>
              <button onClick={()=>{setMetas({...tmpMetas});setShowMetas(false);}}
                style={{flex:1,padding:"9px",borderRadius:8,border:"none",
                  background:"var(--accent)",color:"#fff",fontWeight:700,cursor:"pointer",fontSize:14}}>Salvar</button>
              <button onClick={()=>setShowMetas(false)}
                style={{flex:1,padding:"9px",borderRadius:8,border:"1px solid var(--border)",
                  background:"transparent",color:"var(--text2)",cursor:"pointer",fontSize:14}}>Cancelar</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
