<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Resumo Diário · Scanner 4.0 · RJ</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans',sans-serif;min-height:100vh;transition:background .25s,color .25s}
body.dark{background:#08111f;color:#dde7f5}
body.light{background:#f0f4fa;color:#1a2e4a}
::-webkit-scrollbar{height:5px;width:5px}
body.dark ::-webkit-scrollbar-track{background:#08111f}
body.dark ::-webkit-scrollbar-thumb{background:#1e3352;border-radius:3px}
body.light ::-webkit-scrollbar-track{background:#e2eaf5}
body.light ::-webkit-scrollbar-thumb{background:#94adc8;border-radius:3px}
select option{background:inherit}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
.fade{animation:fd .2s ease}
@keyframes fd{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
button{font-family:inherit;transition:all .15s}

/* ── DARK tokens ── */
body.dark { --bg0:#08111f; --bg1:#0a1628; --bg2:#0d1f38; --bg3:#0f2445;
  --border:#1a2e4a; --border2:#1e3352; --text0:#dde7f5; --text1:#7db8e8;
  --text2:#4b7ba8; --text3:#2d5a8e; --text4:#1e3a5a; --text5:#1a2e4a;
  --accent:#3b82f6; --meta:#d97706; --ins:#1e3a8a; --ins-t:#60a5fa;
  --out:#4c1d95; --out-t:#c084fc; --tag-bg:#0f1e35; }

/* ── LIGHT tokens ── */
body.light { --bg0:#f0f4fa; --bg1:#ffffff; --bg2:#e8eef8; --bg3:#d8e4f4;
  --border:#c8d8ec; --border2:#b0c8e4; --text0:#1a2e4a; --text1:#1d4ed8;
  --text2:#2d5a8e; --text3:#4b7ba8; --text4:#6a96bc; --text5:#94adc8;
  --accent:#2563eb; --meta:#b45309; --ins:#dbeafe; --ins-t:#1d4ed8;
  --out:#ede9fe; --out-t:#7c3aed; --tag-bg:#e8eef8; }
</style>
</head>
<body class="dark">
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useCallback, useRef, useEffect } = React;

const EMBEDDED = {};

const SEMANAL_DATA = {};
const PONTOS_DAILY = {};
const PONTOS_DATA = {};

const MN={"1":"Jan","2":"Fev","3":"Mar","4":"Abr","5":"Mai","6":"Jun","7":"Jul","8":"Ago","9":"Set","10":"Out","11":"Nov","12":"Dez"};
const UTS=["Magé","Niterói","São Gonçalo","Serrana","Sul"];
const UTN=["Lagos","Macaé","Noroeste","Campos"];
const TIPOS=["Insourcing","Outsourcing"];
const KPI_KEYS=["login","despacho","plataforma","intervalo","retorno","producao"];
const KPI_LBL={login:"1º Login",plataforma:"T. Plataforma",despacho:"Despacho",intervalo:"Intervalo",retorno:"R. Base",producao:"Produção"};
const KPI_UNIT={login:"min",plataforma:"min",despacho:"min",intervalo:"min",retorno:"min",producao:"OS"};
const LIB={login:true,plataforma:true,despacho:true,intervalo:true,retorno:true,producao:false};
const DEF_META={login:8,plataforma:25,despacho:10,intervalo:60,retorno:40,producao:4.4};

const PROCESSOS=[
  {key:"Op+Extra",  label:"Op + Extra Op.", desc:"Operação + Extra Operação"},
  {key:"Operação",  label:"Operação",        desc:"Somente Operação"},
  {key:"Extra Operação", label:"Extra Op.", desc:"Somente Extra Operação"},
  {key:"Comercial", label:"Comercial",      desc:"Corte e Religação + Novas Ligações + Gestor Novas Ligações"},
  {key:"Manutenção", label:"Manutenção",    desc:"Manutenção"},
  {key:"Perdas",    label:"Perdas",          desc:"Perdas + Ampla Chip"},
  {key:"Obras",     label:"Obras",           desc:"Obras"},
  {key:"Linha Viva",label:"Linha Viva",      desc:"Linha Viva"},
  {key:"Poda",      label:"Poda",            desc:"Poda"},
  {key:"Todos",      label:"Todos",          desc:"Todos os processos"},
];


function classifyPolo(base){
  if(!base)return"";const b=(base+"").toUpperCase().trim();
  if(b==="NITERÓI"||b==="NITEROI")return"Niterói";
  if(b.includes("GONCALO")||b.includes("GONÇALO"))return"São Gonçalo";
  if(b==="MAGÉ"||b==="MAGE")return"Magé";
  if(b==="ANGRA"||b==="RESENDE")return"Sul";
  if(b==="PETRÓPOLIS"||b==="PETROPOLIS"||b==="TERESÓPOLIS"||b==="TERESOPOLIS")return"Serrana";
  if(b==="ARARUAMA"||b.includes("CABO FRIO"))return"Lagos";
  if(b==="CAMPOS")return"Campos";
  if(b==="CANTAGALO"||b==="ITAPERUNA"||b==="PÁDUA"||b==="PADUA")return"Noroeste";
  if(b==="MACAÉ"||b==="MACAE")return"Macaé";
  return"";
}
function classifyEP(eq){
  if(!eq)return"X";const ch=(eq+"").slice(-3,999).charAt(0);
  if(ch==="P")return"Parceira";if(ch==="E")return"Enel";return"X";
}
// De/Para oficial do processo (chave normalizada: maiúscula, sem acento)
const PROC_DEPARA={
  "AMPLA CHIP":"Perdas",
  "CORTE E RELIGACAO":"Comercial",
  "EXTRA OPERACAO":"Extra Operação",
  "GESTOR NOVAS LIGACOES":"Comercial",
  "LINHA VIVA":"Linha Viva",
  "MANUTENCAO":"Manutenção",
  "NOVAS LIGACOES":"Comercial",
  "OBRAS":"Obras",
  "OPERACAO":"Operação",
  "PERDAS":"Perdas",
  "PODA":"Poda",
};
function normProcKey(v){
  return (v==null?"":v+"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/\s+/g," ").trim();
}
function classifyProcesso(proc){
  const k=normProcKey(proc);
  return k?(PROC_DEPARA[k]||null):null;
}

function parseXLSX(wb, dayFilter){
  function mapProc(raw){ return classifyProcesso(raw); }

  // ── helpers to map by HEADER NAME (não posição) ──
  // Build first/last index lookups; handles duplicate header names.
  function buildHeaderMap(rows){
    const first={},last={};
    const hdrs=(rows[0]||[]).map(h=>(h==null?"":String(h)).trim());
    hdrs.forEach((h,i)=>{ if(!(h in first)) first[h]=i; last[h]=i; });
    return {hdrs,first,last};
  }
  // Resolve column by trying multiple candidate names (returns -1 if none)
  function col(map, candidates, useLast=false){
    const src=useLast?map.last:map.first;
    for(const c of candidates){ if(c in src) return src[c]; }
    return -1;
  }

  // Polo derivation from base name (fallback when POLO column vazia)
  function poloFromBase(rawBase){
    const b=(rawBase||"").toUpperCase().trim();
    if(b==="NITERÓI"||b==="NITEROI")return"Niterói";
    if(b==="SÃO GONÇALO"||b.includes("GONCALO"))return"São Gonçalo";
    if(b==="MAGÉ"||b==="MAGE")return"Magé";
    if(b==="ANGRA"||b==="RESENDE")return"Sul";
    if(b==="PETRÓPOLIS"||b==="PETROPOLIS"||b==="TERESÓPOLIS"||b==="TERESOPOLIS")return"Serrana";
    if(b==="ARARUAMA"||b.includes("CABO FRIO"))return"Lagos";
    if(b==="CAMPOS")return"Campos";
    if(b==="CANTAGALO"||b==="ITAPERUNA"||b==="PÁDUA"||b==="PADUA")return"Noroeste";
    if(b==="MACAÉ"||b==="MACAE")return"Macaé";
    return "";
  }

  const mainSN=wb.SheetNames.find(s=>s.includes("Tabela Compl")||s.includes("Scanner"))||wb.SheetNames[0];
  const rawRows=XLSX.utils.sheet_to_json(wb.Sheets[mainSN],{header:1,defval:null});
  if(rawRows.length<2) return null;
  const HMAP=buildHeaderMap(rawRows);

  // Common columns (KPI / dimensões) — resolvidos por NOME
  const C={
    data:      col(HMAP,["Data Referência","Data Referencia","Data"]),
    base:      col(HMAP,["Base"]),
    intervalo: col(HMAP,["Intervalo"]),                 // primeira ocorrência (col J)
    mes:       col(HMAP,["mês_calculo","mes_calculo","Mês","Mes"]),
    ep:        col(HMAP,["Enel/Parceira"]),
    processo:  col(HMAP,["Processo"]),
    polo:      col(HMAP,["POLO","Polo"]),
    producao:  col(HMAP,["Qtd Serviços","Qtd Servicos"]),
    login:     col(HMAP,["1º Login Corrigido","1° Login Corrigido"]),
    desloc:    col(HMAP,["1º Desloc","1° Desloc"]),     // KPI "plataforma" histórico aponta para este
    despacho:  col(HMAP,["1º Despacho","1° Despacho"]),
    retorno:   col(HMAP,["Retorno a base","Retorno a Base"]),
    classif:   col(HMAP,["Classificação","Classificacao"]),
  };
  // Para back-compat o KPI rotulado "plataforma" no resto do app continua lendo "1º Desloc"
  // (era assim no código original com índice fixo 47); usamos o mesmo dado por nome.
  const KPI_COL={
    login:     C.login,
    plataforma:C.desloc,
    despacho:  C.despacho,
    intervalo: C.intervalo,
    retorno:   C.retorno,
    producao:  C.producao,
  };

  // ── Colunas de PONTUAÇÃO (CH..CX) — todas as colunas APÓS "Classificação" ──
  const SCORE_TOTAL_COLS = [];
  if(C.classif>=0){
    for(let i=C.classif+1;i<HMAP.hdrs.length;i++) SCORE_TOTAL_COLS.push(i);
  }
  // Itens individuais exibidos no painel — mapeados por NOME (segunda ocorrência = bloco CH..CX)
  const SCORE_IDX={
    ativ:       col(HMAP,["Ativ/Equipe/Dia"], true),
    eficiencia: col(HMAP,["Eficiencia","Eficiência"], true),
    utilizacao: col(HMAP,["Utilização","Utilizacao"], true),
    login:      col(HMAP,["1º Login","1° Login"], true),
    desloc:     col(HMAP,["1º Desloc","1° Desloc"], true),
    retorno:    col(HMAP,["Retorno a Base","Retorno a base"], true),
    tasktime:   col(HMAP,["Task Time TR"], true),
    tmr_sec:    col(HMAP,["TMR Secundário","TMR Secundario"], true),
    tmr_imp:    col(HMAP,["TMR Improd.","TMR Improd"], true),
  };
  const SCORE_KEYS=Object.keys(SCORE_IDX);

  const tn=v=>{if(v==null)return null;const n=parseFloat(v);return(isNaN(n)||n<0||n>1440)?null:Math.round(n*100)/100;};
  const tp=v=>{if(v==null)return null;const n=parseFloat(v);return(isNaN(n)||n<0)?null:Math.round(n*100)/100;};
  const tnum=v=>{if(v==null)return null;const n=parseFloat(v);return isNaN(n)?null:n;};

  function rowDate(r){
    const rd=C.data>=0?r[C.data]:null;
    if(rd instanceof Date) return rd.toISOString().slice(0,10);
    if(typeof rd==="number"){const d=XLSX.SSF.parse_date_code(rd);if(d)return `${d.y}-${String(d.m).padStart(2,"0")}-${String(d.d).padStart(2,"0")}`;}
    if(typeof rd==="string") return rd.slice(0,10);
    return null;
  }
  function rowPolo(r){
    let polo=C.polo>=0?(r[C.polo]||""):"";
    if(!polo) polo=poloFromBase(C.base>=0?r[C.base]:"");
    return polo;
  }

  // ── FILTRO DE DIAS (global, aplicado a todas as abas) ──
  const allDatesSet=new Set();
  for(let i=1;i<rawRows.length;i++){const r=rawRows[i];if(!r)continue;const d=rowDate(r);if(d&&d.length>=10)allDatesSet.add(d);}
  const allDates=[...allDatesSet].sort();
  const daySet=(dayFilter&&dayFilter.length)?new Set(dayFilter):null;
  const dayMonths=daySet?new Set([...daySet].map(d=>d.slice(0,7))):null;
  // O filtro só restringe os meses que possuem dias selecionados (demais meses ficam íntegros).
  const dayOK=r=>{ if(!daySet) return true; const d=rowDate(r); if(!d) return false;
    return dayMonths.has(d.slice(0,7)) ? daySet.has(d) : true; };

  // ── KPI diário (recs) ──
  const recs=[];
  for(let i=1;i<rawRows.length;i++){
    const r=rawRows[i]; if(!r) continue;
    if(!dayOK(r)) continue;
    const polo=rowPolo(r);
    const ep=C.ep>=0?r[C.ep]:null;
    const mes=C.mes>=0?r[C.mes]:null;
    if(!polo||!ep||!mes) continue;
    if(ep!=="Enel"&&ep!=="Parceira") continue;
    const proc=mapProc(C.processo>=0?r[C.processo]:null); if(!proc) continue;
    const tipo=ep==="Enel"?"Insourcing":"Outsourcing";
    const ds=rowDate(r); if(!ds||ds.length<10) continue;
    const rec={polo,tipo,mes:parseInt(mes),ds,proc};
    for(const k of KPI_KEYS){
      const idx=KPI_COL[k];
      rec[k]=idx>=0?(k==="producao"?tp(r[idx]):tn(r[idx])):null;
    }
    recs.push(rec);
  }

  // bucket → aggregate
  const buckets={};
  for(const r of recs){
    const isOpExtra=r.proc==="Operação"||r.proc==="Extra Operação";
    const pgs=[r.proc,"Todos",...(isOpExtra?["Op+Extra"]:[])];
    for(const pg of pgs){
      for(const t of [r.tipo,"Polo"]){
        const key=`${r.mes}|${r.polo}|${t}|${pg}|${r.ds}`;
        if(!buckets[key]) buckets[key]={mes:r.mes,polo:r.polo,tipo:t,pg,ds:r.ds,
          login:[],plataforma:[],despacho:[],intervalo:[],retorno:[],producao:[]};
        for(const k of KPI_KEYS){if(r[k]!=null) buckets[key][k].push(r[k]);}
      }
    }
  }

  const result={};
  for(const bk of Object.values(buckets)){
    const{mes,polo,tipo,pg,ds}=bk;
    const ms=String(mes);
    if(!result[ms])result[ms]={};
    if(!result[ms][polo])result[ms][polo]={};
    if(!result[ms][polo][tipo])result[ms][polo][tipo]={};
    if(!result[ms][polo][tipo][pg])result[ms][polo][tipo][pg]={daily:{},mtd:{}};
    const dv={};
    for(const k of KPI_KEYS){const v=bk[k];dv[k]=v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length*100)/100:null;}
    result[ms][polo][tipo][pg].daily[ds]=dv;
  }

  // MTD
  for(const ms of Object.keys(result))
    for(const polo of Object.keys(result[ms]))
      for(const tipo of Object.keys(result[ms][polo]))
        for(const pg of Object.keys(result[ms][polo][tipo])){
          const d=result[ms][polo][tipo][pg].daily;
          const mtd={};
          for(const k of KPI_KEYS){const vv=Object.values(d).map(x=>x[k]).filter(v=>v!=null);
            mtd[k]=vv.length?Math.round(vv.reduce((a,b)=>a+b,0)/vv.length*100)/100:null;}
          result[ms][polo][tipo][pg].mtd=mtd;
        }

  // ── PONTUAÇÃO (mensal por polo/tipo/processo) ──
  // Itens individuais: média do mês de cada coluna específica (CH..CX).
  // TOTAL: soma das médias de TODAS as colunas após "Classificação" (CH..CX).
  const ptBuckets={};
  for(let i=1;i<rawRows.length;i++){
    const r=rawRows[i]; if(!r) continue;
    if(!dayOK(r)) continue;
    const polo=rowPolo(r);
    const ep=C.ep>=0?r[C.ep]:null;
    const mes=C.mes>=0?r[C.mes]:null;
    const proc=mapProc(C.processo>=0?r[C.processo]:null);
    if(!polo||!ep||!mes||!proc) continue;
    if(ep!=="Enel"&&ep!=="Parceira") continue;
    const tipo=ep==="Enel"?"Insourcing":"Outsourcing";
    const isOpExtra=proc==="Operação"||proc==="Extra Operação";
    const pgs=[proc,"Todos",...(isOpExtra?["Op+Extra"]:[])];
    for(const pg of pgs){
      for(const t of [tipo,"Polo"]){
        const key=`${parseInt(mes)}|${polo}|${t}|${pg}`;
        if(!ptBuckets[key]){
          ptBuckets[key]={mes:parseInt(mes),polo,tipo:t,pg,items:{},totalCols:{}};
          SCORE_KEYS.forEach(k=>ptBuckets[key].items[k]=[]);
          SCORE_TOTAL_COLS.forEach(ci=>ptBuckets[key].totalCols[ci]=[]);
        }
        SCORE_KEYS.forEach(k=>{const idx=SCORE_IDX[k];if(idx<0)return;const v=tnum(r[idx]);if(v!=null)ptBuckets[key].items[k].push(v);});
        SCORE_TOTAL_COLS.forEach(ci=>{const v=tnum(r[ci]);if(v!=null)ptBuckets[key].totalCols[ci].push(v);});
      }
    }
  }
  const pontos={};
  for(const bk of Object.values(ptBuckets)){
    const ms=String(bk.mes);
    if(!pontos[ms])pontos[ms]={};
    if(!pontos[ms][bk.polo])pontos[ms][bk.polo]={};
    if(!pontos[ms][bk.polo][bk.tipo])pontos[ms][bk.polo][bk.tipo]={};
    const agg={};
    SCORE_KEYS.forEach(k=>{const v=bk.items[k];agg[k]=v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length*100)/100:null;});
    // TOTAL = soma das médias de cada coluna CH..CX
    let total=0,hasAny=false;
    SCORE_TOTAL_COLS.forEach(ci=>{const v=bk.totalCols[ci];if(v.length){total+=v.reduce((a,b)=>a+b,0)/v.length;hasAny=true;}});
    agg.total=hasAny?Math.round(total*100)/100:null;
    pontos[ms][bk.polo][bk.tipo][bk.pg]=agg;
  }

  // ── PONTUAÇÃO DIÁRIA ──
  // Total por dia = soma das médias diárias de cada coluna CH..CX.
  const pdBuckets={};
  for(let i=1;i<rawRows.length;i++){
    const r=rawRows[i]; if(!r) continue;
    if(!dayOK(r)) continue;
    const polo=rowPolo(r);
    const ep=C.ep>=0?r[C.ep]:null;
    const mes=C.mes>=0?r[C.mes]:null;
    const proc=mapProc(C.processo>=0?r[C.processo]:null);
    if(!polo||!ep||!mes||!proc) continue;
    if(ep!=="Enel"&&ep!=="Parceira") continue;
    const tipo=ep==="Enel"?"Insourcing":"Outsourcing";
    const ds=rowDate(r); if(!ds||ds.length<10) continue;
    const isOpExtra=proc==="Operação"||proc==="Extra Operação";
    const pgs=[proc,"Todos",...(isOpExtra?["Op+Extra"]:[])];
    for(const pg of pgs){
      for(const t of [tipo,"Polo"]){
        const key=`${parseInt(mes)}|${polo}|${t}|${pg}|${ds}`;
        if(!pdBuckets[key]){
          pdBuckets[key]={mes:parseInt(mes),polo,tipo:t,pg,ds,totalCols:{}};
          SCORE_TOTAL_COLS.forEach(ci=>pdBuckets[key].totalCols[ci]=[]);
        }
        SCORE_TOTAL_COLS.forEach(ci=>{const v=tnum(r[ci]);if(v!=null)pdBuckets[key].totalCols[ci].push(v);});
      }
    }
  }
  const pontosDaily={};
  for(const bk of Object.values(pdBuckets)){
    const ms=String(bk.mes);
    if(!pontosDaily[ms])pontosDaily[ms]={};
    if(!pontosDaily[ms][bk.polo])pontosDaily[ms][bk.polo]={};
    if(!pontosDaily[ms][bk.polo][bk.tipo])pontosDaily[ms][bk.polo][bk.tipo]={};
    if(!pontosDaily[ms][bk.polo][bk.tipo][bk.pg])pontosDaily[ms][bk.polo][bk.tipo][bk.pg]={};
    let total=0,hasAny=false;
    SCORE_TOTAL_COLS.forEach(ci=>{const v=bk.totalCols[ci];if(v.length){total+=v.reduce((a,b)=>a+b,0)/v.length;hasAny=true;}});
    pontosDaily[ms][bk.polo][bk.tipo][bk.pg][bk.ds]=hasAny?Math.round(total*10)/10:null;
  }

  // ── SEMANAL (week-of-month aggregation) ──
  function weekOfMonth(day){ return day<=7?1:day<=14?2:day<=21?3:day<=28?4:5; }

  const semBuckets={};
  for(let i=1;i<rawRows.length;i++){
    const r=rawRows[i]; if(!r) continue;
    if(!dayOK(r)) continue;
    const polo=C.polo>=0?r[C.polo]:null;
    const ep=C.ep>=0?r[C.ep]:null;
    const mes=C.mes>=0?r[C.mes]:null;
    const proc=mapProc(C.processo>=0?r[C.processo]:null);
    if(!polo||!ep||!mes||!proc) continue;
    if(ep!=="Enel"&&ep!=="Parceira") continue;
    const tipo=ep==="Enel"?"Insourcing":"Outsourcing";
    const ds=rowDate(r); if(!ds||ds.length<10) continue;
    const day=parseInt(ds.slice(8,10)); if(isNaN(day)) continue;
    const wom=weekOfMonth(day);
    const isOpExtra=proc==="Operação"||proc==="Extra Operação";
    const pgs=[proc,"Todos",...(isOpExtra?["Op+Extra"]:[])];
    const kmap={};
    for(const k of KPI_KEYS){const idx=KPI_COL[k]; kmap[k]=idx>=0?r[idx]:null;}
    for(const pg of pgs){
      for(const t of [tipo,"Polo"]){
        const key=`${parseInt(mes)}|${polo}|${t}|${pg}|${wom}`;
        if(!semBuckets[key]){semBuckets[key]={mes:parseInt(mes),polo,tipo:t,pg,wom,d_ini:ds,d_fim:ds,
          login:[],despacho:[],plataforma:[],intervalo:[],retorno:[],producao:[],totalCols:{}};
          SCORE_TOTAL_COLS.forEach(ci=>semBuckets[key].totalCols[ci]=[]);}
        if(ds<semBuckets[key].d_ini)semBuckets[key].d_ini=ds;
        if(ds>semBuckets[key].d_fim)semBuckets[key].d_fim=ds;
        for(const k of KPI_KEYS){const v=k==="producao"?tp(kmap[k]):tn(kmap[k]);if(v!=null)semBuckets[key][k].push(v);}
        SCORE_TOTAL_COLS.forEach(ci=>{const v=tnum(r[ci]);if(v!=null)semBuckets[key].totalCols[ci].push(v);});
      }
    }
  }
  const semanalData={};
  for(const bk of Object.values(semBuckets)){
    const ms=String(bk.mes); const wk=String(bk.wom);
    if(!semanalData[ms])semanalData[ms]={};
    if(!semanalData[ms][bk.polo])semanalData[ms][bk.polo]={};
    if(!semanalData[ms][bk.polo][bk.tipo])semanalData[ms][bk.polo][bk.tipo]={};
    if(!semanalData[ms][bk.polo][bk.tipo][bk.pg])semanalData[ms][bk.polo][bk.tipo][bk.pg]={};
    const agg={d_ini:bk.d_ini,d_fim:bk.d_fim};
    for(const k of KPI_KEYS){const v=bk[k];agg[k]=v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length*10)/10:null;}
    // pontos semanais = soma das médias semanais de cada coluna CH..CX
    let total=0,hasAny=false;
    SCORE_TOTAL_COLS.forEach(ci=>{const v=bk.totalCols[ci];if(v.length){total+=v.reduce((a,b)=>a+b,0)/v.length;hasAny=true;}});
    agg.pontos=hasAny?Math.round(total*10)/10:null;
    semanalData[ms][bk.polo][bk.tipo][bk.pg][wk]=agg;
  }

  if(!recs.length) return null;
  return {kpi:result, pontos, pontosDaily, semanalData, allDates};
}

/* ── HELPERS ── */
function getStatus(val,meta,k){
  if(val===null||val===undefined)return"nd";
  return LIB[k]?(val<=meta?"ok":val<=meta*1.3?"warn":"bad"):(val>=meta?"ok":val>=meta*0.85?"warn":"bad");
}
const SC_DARK={ok:{b:"#16a34a",t:"#fff",g:"#16a34a44"},warn:{b:"#d97706",t:"#fff",g:"#d9770633"},
  bad:{b:"#dc2626",t:"#fff",g:"#dc262633"},nd:{b:"#1e3352",t:"#4b6a8a",g:"transparent"}};
const SC_LIGHT={ok:{b:"#15803d",t:"#fff",g:"#15803d33"},warn:{b:"#b45309",t:"#fff",g:"#b4530933"},
  bad:{b:"#b91c1c",t:"#fff",g:"#b91c1c33"},nd:{b:"#cbd5e1",t:"#64748b",g:"transparent"}};

const fmt=(v,d=1)=>v===null||v===undefined?"—":v.toFixed(d);

function Chip({val,meta,k,sz="sm",dark}){
  const SC=dark?SC_DARK:SC_LIGHT;
  const s=getStatus(val,meta,k),c=SC[s];
  if(val===null||val===undefined)
    return<span style={{color:"var(--text5)",fontSize:sz==="sm"?13:15}}>—</span>;
  return<span style={{display:"inline-block",background:c.b,color:c.t,borderRadius:4,
    padding:sz==="sm"?"3px 6px":"4px 9px",fontSize:sz==="sm"?13:15,fontWeight:700,
    minWidth:42,textAlign:"center",boxShadow:`0 0 5px ${c.g}`}}>{val.toFixed(1)}</span>;
}

  },[open]);
  if(!dias.length) return null;

        <div style={{position:"absolute",top:"calc(100% + 5px)",right:0,zIndex:300,

          boxShadow:"0 10px 26px #00000055",minWidth:230,maxHeight:340,overflowY:"auto"}}>

/* ── EVOLUÇÃO CHART SVG ── */
function EvolucaoChart({polo,kpiKey,metas,kpiData,processo,dark,mode}){
  const SC=dark?SC_DARK:SC_LIGHT;
  const meses=Object.keys(kpiData).sort((a,b)=>parseInt(a)-parseInt(b));
  if(!meses.length)return null;
  const meta=metas?.[kpiKey];
  const tipos=mode==="polo"?["Polo"]:TIPOS;
  const series=tipos.map(tipo=>({
    tipo,
    vals:meses.map(m=>kpiData[m]?.[polo]?.[tipo]?.[processo]?.mtd?.[kpiKey]??null)
  }));
  const allVals=[...series.flatMap(s=>s.vals.filter(v=>v!==null))];
  if(meta!=null)allVals.push(meta);
  const maxV=(Math.max(...allVals)||1)*1.15;
  const W=540,H=155,PL=34,PR=32,PT=14,PB=38;
  const cW=W-PL-PR,cH=H-PT-PB;
  const toY=v=>PT+cH-(Math.max(0,v/maxV)*cH);
  const metaY=meta!=null?toY(meta):null;
  const n=meses.length;
  const grpW=cW/n;
  const nTipos=tipos.length;
  const barW=Math.min(nTipos===1?32:24,grpW*(nTipos===1?0.55:0.36));
  const TCOL={Insourcing:"#3b82f6",Outsourcing:"#a855f7",Polo:"#10b981"};
  const gridColor=dark?"#1a2e4a":"#e2eaf5";
  const labelColor=dark?"#2d5a8e":"#94adc8";
  const mesColor=dark?"#4b7ba8":"#64748b";
  return(
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",maxWidth:W,display:"block"}}>
      {[0,.25,.5,.75,1].map(f=>{
        const yy=PT+cH*(1-f);
        const v=(maxV*f);
        return<g key={f}>
          <line x1={PL} y1={yy} x2={W-PR} y2={yy} stroke={gridColor} strokeWidth={0.7}/>
          <text x={PL-3} y={yy+4} textAnchor="end" fontSize={10} fill={labelColor}>{v.toFixed(1)}</text>
        </g>;
      })}
      {metaY!=null&&<>
        <line x1={PL} y1={metaY} x2={W-PR} y2={metaY}
          stroke="#f59e0b" strokeWidth={1.5} strokeDasharray="5,3" opacity={0.9}/>
        <text x={W-PR+2} y={metaY+4} fontSize={10} fill="#f59e0b" fontWeight="600">Meta</text>
      </>}
      {meses.map((m,mi)=>{
        const cx=PL+mi*grpW+grpW/2;
        return<g key={m}>
          {tipos.map((tipo,ti)=>{
            const val=series[ti].vals[mi];
            if(val===null)return null;
            const x=nTipos===1?cx-barW/2:cx+(ti===0?-barW-1:1);
            const y=toY(val);
            const bh=Math.max(1,toY(0)-y);
            const bc=TCOL[tipo];
            return<g key={tipo}>
              <rect x={x} y={y} width={barW} height={bh} fill={bc} opacity={0.88} rx={2}/>
              <text x={x+barW/2} y={y-4} textAnchor="middle" fontSize={10} fill={bc} fontWeight="bold">{val.toFixed(1)}</text>
            </g>;
          })}
          <text x={cx} y={H-PB+15} textAnchor="middle" fontSize={11} fill={mesColor} fontWeight="600">{MN[m]||m}</text>
        </g>;
      })}
      {tipos.map((tipo,ti)=>(
        <g key={tipo} transform={`translate(${PL+ti*95},${H-PB+26})`}>
          <rect width={11} height={11} fill={TCOL[tipo]} rx={2} opacity={0.85}/>
          <text x={14} y={9.5} fontSize={11} fill={dark?"#7db8e8":"#2d5a8e"}>{tipo}</text>
        </g>
      ))}
    </svg>
  );
}

/* ── GRÁFICO COMPARATIVO POLOS (eixo X = polos) ── */
function PolosChart({kpiKey,metas,kpiData,selectedMes,polos,processo,dark,utsSep}){

    tipo,
    vals:polos.map(p=>kpiData[selectedMes]?.[p]?.[tipo]?.[processo]?.mtd?.[kpiKey]??null)
  }));
  const allVals=[...series.flatMap(s=>s.vals.filter(v=>v!==null)),meta];
  const maxV=Math.max(...allVals)*1.18||1;
  const W=560,H=170,PL=34,PR=36,PT=14,PB=42;
  const cW=W-PL-PR,cH=H-PT-PB;
  const toY=v=>PT+cH-(Math.max(0,v/maxV)*cH);
  const metaY=toY(meta);
  const n=polos.length;
  const grpW=cW/n;
  // smaller bars when many polos
  const barW=Math.min(22,Math.max(8,grpW*0.30));
  const gridColor=dark?"#1a2e4a":"#e2eaf5";
  const labelColor=dark?"#2d5a8e":"#94adc8";
  const poloColor=dark?"#4b7ba8":"#64748b";
  const shortName=p=>p==="São Gonçalo"?"S.Gonç.":p==="Noroeste"?"Noroe.":p;
  return(
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",maxWidth:W,display:"block"}}>
      {[0,.25,.5,.75,1].map(f=>{
        const yy=PT+cH*(1-f);
        const v=maxV*f;
        return<g key={f}>
          <line x1={PL} y1={yy} x2={W-PR} y2={yy} stroke={gridColor} strokeWidth={0.7}/>
          <text x={PL-3} y={yy+4} textAnchor="end" fontSize={10} fill={labelColor}>{v.toFixed(1)}</text>
        </g>;
      })}
      {/* meta line */}
      <line x1={PL} y1={metaY} x2={W-PR} y2={metaY}
        stroke="#f59e0b" strokeWidth={1.5} strokeDasharray="5,3" opacity={0.9}/>
      <text x={W-PR+2} y={metaY+4} fontSize={10} fill="#f59e0b" fontWeight="600">Meta</text>
      {/* UTS/UTN separator */}
      {utsSep!=null&&utsSep>0&&utsSep<n&&(()=>{
        const sepX=PL+utsSep*grpW;
        return<g>
          <line x1={sepX} y1={PT-4} x2={sepX} y2={H-PB+4}
            stroke="#a855f766" strokeWidth={1.2} strokeDasharray="4,3"/>
          <text x={sepX-2} y={PT-7} textAnchor="end" fontSize={10} fill="#0ea5e9" fontWeight="600">UTS</text>
          <text x={sepX+3} y={PT-7} textAnchor="start" fontSize={10} fill="#a855f7" fontWeight="600">UTN</text>
        </g>;
      })()}
      {/* bars */}
      {polos.map((polo,pi)=>{

        return<g key={polo}>
          {TIPOS.map((tipo,ti)=>{
            const val=series[ti].vals[pi];
            if(val===null)return null;
            const x=cx+(ti===0?-barW-1:1);
            const y=toY(val);
            const bh=Math.max(1,toY(0)-y);
            const bc=TCOL[tipo];
            return<g key={tipo}>
              <rect x={x} y={y} width={barW} height={bh} fill={bc} opacity={0.88} rx={2}/>
              <text x={x+barW/2} y={y-4} textAnchor="middle" fontSize={9.5} fill={bc} fontWeight="bold">{val.toFixed(1)}</text>
            </g>;
          })}
          <text x={cx} y={H-PB+15} textAnchor="middle" fontSize={11} fill={poloColor} fontWeight="600">{shortName(polo)}</text>
        </g>;
      })}
      {/* legend */}
      {TIPOS.map((tipo,ti)=>(
        <g key={tipo} transform={`translate(${PL+ti*95},${H-PB+28})`}>
          <rect width={11} height={11} fill={TCOL[tipo]} rx={2} opacity={0.85}/>
          <text x={14} y={9.5} fontSize={11} fill={dark?"#7db8e8":"#2d5a8e"}>{tipo}</text>
        </g>
      ))}
    </svg>
  );
}

/* ── TAB EVOLUÇÃO ── */
function TabEvolucao({kpiData,metas,selectedUT,processo,dark,pontosData}){
  const [polo,setPolo]=useState(null);
  const [mode,setMode]=useState("split"); // "split" | "polo"
  const groupPolos=selectedUT==="UTS"?UTS:selectedUT==="UTN"?UTN:UTS.concat(UTN);
  // pseudo-polos agregados ficam no topo
  const polos=["UTS","UTN"].concat(groupPolos);
  const activePolo=(polo&&polos.includes(polo))?polo:"UTS";
  const meses=Object.keys(kpiData).sort((a,b)=>parseInt(a)-parseInt(b));
  const TIPOS_EXT=["Insourcing","Outsourcing","Polo"];
  // constrói kpiData estendido com agregados UTS / UTN (média entre polos com dado)
  const wrappedKpiData=React.useMemo(()=>{
    const out={};
    const groups={UTS,UTN};
    meses.forEach(m=>{
      const base=kpiData[m]||{};
      const clone={...base};
      Object.entries(groups).forEach(([gName,gList])=>{
        const agg={};
        TIPOS_EXT.forEach(tipo=>{
          const mtdSum={},mtdCnt={};
          gList.forEach(p=>{
            const mtd=base[p]?.[tipo]?.[processo]?.mtd;
            if(!mtd)return;
            Object.entries(mtd).forEach(([k,v])=>{
              if(v==null||isNaN(v))return;
              mtdSum[k]=(mtdSum[k]||0)+v;
              mtdCnt[k]=(mtdCnt[k]||0)+1;
            });
          });
          const mtdAvg={};
          Object.keys(mtdSum).forEach(k=>{mtdAvg[k]=mtdSum[k]/mtdCnt[k];});
          agg[tipo]={[processo]:{mtd:mtdAvg}};
        });
        clone[gName]=agg;
      });
      out[m]=clone;
    });
    return out;
  },[kpiData,processo,meses.join("|")]);
  // pontosData estendido: agrega UTS / UTN por tipo (média dos totais dos polos com dado)
  const wrappedPontosData=React.useMemo(()=>{
    if(!pontosData)return {};
    const out={};
    const mesesP=Object.keys(pontosData);
    const groups={UTS,UTN};
    mesesP.forEach(m=>{
      const base=pontosData[m]||{};
      const clone={...base};
      Object.entries(groups).forEach(([gName,gList])=>{
        const agg={};
        TIPOS_EXT.forEach(tipo=>{
          let s=0,c=0;
          gList.forEach(p=>{
            const t=base[p]?.[tipo]?.[processo]?.total;
            if(t==null||isNaN(t))return;
            s+=t;c++;
          });
          agg[tipo]={[processo]:{total:c?s/c:null}};
        });
        clone[gName]=agg;
      });
      out[m]=clone;
    });
    return out;
  },[pontosData,processo]);
  const showTipos=mode==="polo"?["Polo"]:["Insourcing","Outsourcing"];

    <div className="fade" style={{padding:"16px 20px"}}>

              const isAgg=p==="UTS"||p==="UTN";

              const isUTN=UTN.includes(p)||p==="UTN";
              return<button key={p} onClick={()=>setPolo(p)} style={{
                padding:"5px 16px",borderRadius:20,
                border:isAgg?"1px solid var(--accent)":(isUTN&&activePolo!==p?"1px dashed var(--border2)":"none"),
                cursor:has?"pointer":"default",fontWeight:isAgg?800:700,fontSize:13,letterSpacing:isAgg?".5px":0,
                background:activePolo===p?`linear-gradient(135deg,${isUTN?"#8b5cf6":"var(--accent)"},#0ea5e9)`:"var(--tag-bg)",
                color:activePolo===p?"#fff":has?"var(--text2)":"var(--text5)",
                boxShadow:activePolo===p?"0 2px 12px #1d4ed844":"none",opacity:has?1:0.4}}>{p}</button>;
            })}
          </div>
        </div>
        <div style={{marginLeft:"auto"}}>
          <div style={{fontSize:11,color:"var(--text4)",fontWeight:700,letterSpacing:".5px",marginBottom:6}}>VISÃO</div>
          <div style={{display:"flex",gap:6}}>
            {[["split","Insourcing / Out"],["polo","Consolidado Polo"]].map(([id,lbl])=>(
              <button key={id} onClick={()=>setMode(id)} style={{
                padding:"5px 14px",borderRadius:20,border:"none",cursor:"pointer",fontWeight:700,fontSize:12,
                background:mode===id?(id==="polo"?"#10b981":"var(--accent)"):"var(--tag-bg)",
                color:mode===id?"#fff":"var(--text3)"}}>{lbl}</button>

      </div>
      {/* tabela MTD */}
      <div style={{marginBottom:22,overflowX:"auto"}}>
        <table style={{borderCollapse:"collapse",width:"100%",minWidth:500}}>
          <thead>
            <tr style={{background:"var(--bg2)"}}>
              <th style={{padding:"7px 12px",textAlign:"left",fontSize:11,color:"var(--text3)",fontWeight:700,minWidth:115}}>KPI</th>
              <th style={{padding:"7px 8px",textAlign:"center",fontSize:11,color:"var(--meta)",fontWeight:700,minWidth:48}}>META</th>
              {meses.map(m=><th key={m} colSpan={showTipos.length} style={{padding:"7px 4px",textAlign:"center",
                fontSize:11,color:"var(--accent)",fontWeight:700,borderLeft:"1px solid var(--border)",minWidth:48*showTipos.length}}>

            <tr style={{background:"var(--bg1)"}}>

                ))}
              </React.Fragment>)}
            </tr>
          </thead>
          <tbody>
            {KPI_KEYS.map((k,ki)=>(
              <tr key={k} style={{background:ki%2===0?"var(--bg0)":"var(--bg1)"}}>
                <td style={{padding:"6px 12px",fontSize:12,fontWeight:600,color:"var(--text1)",whiteSpace:"nowrap",borderRight:"1px solid var(--border)"}}>
                  {KPI_LBL[k]}<span style={{fontSize:9,color:"var(--text4)",marginLeft:4}}>{KPI_UNIT[k]}</span>
                </td>
                <td style={{padding:"6px 7px",textAlign:"center",borderRight:"1px solid var(--border)"}}>
                  <span style={{color:"var(--meta)",fontWeight:700,fontSize:12}}>{metas[k]}</span>
                </td>
                {meses.map(m=>(
                  <React.Fragment key={m}>
                    {showTipos.map((tipo,ti)=>{
                      const v=wrappedKpiData[m]?.[activePolo]?.[tipo]?.[processo]?.mtd?.[k]??null;
                      return<td key={tipo} style={{padding:"6px 4px",textAlign:"center",borderLeft:ti===0?"1px solid var(--border)":"none"}}>

            {/* linha PONTUAÇÃO */}
            <tr style={{background:KPI_KEYS.length%2===0?"var(--bg0)":"var(--bg1)",borderTop:"2px solid var(--accent)"}}>

/* ── PONTOS EVOLUÇÃO CHART ── */
function PontosEvolucaoChart({polo,pontosData,processo,dark,mode}){
  const meses=Object.keys(pontosData).sort((a,b)=>parseInt(a)-parseInt(b));
  if(!meses.length)return null;
  const tipos=mode==="polo"?["Polo"]:["Insourcing","Outsourcing"];
  const series=tipos.map(tipo=>({
    tipo,
    vals:meses.map(m=>pontosData[m]?.[polo]?.[tipo]?.[processo]?.total??null)
  }));
  const allVals=series.flatMap(s=>s.vals.filter(v=>v!==null));
  const maxV=(Math.max(...allVals,1)||1)*1.18;
  const W=760,H=180,PL=40,PR=32,PT=14,PB=42;
  const cW=W-PL-PR,cH=H-PT-PB;
  const toY=v=>PT+cH-(Math.max(0,v/maxV)*cH);
  const n=meses.length;
  const grpW=cW/n;
  const nTipos=tipos.length;
  const barW=Math.min(nTipos===1?38:28,grpW*(nTipos===1?0.55:0.36));
  const TCOL={Insourcing:"#3b82f6",Outsourcing:"#a855f7",Polo:"#10b981"};
  const gridColor=dark?"#1a2e4a":"#e2eaf5";
  const labelColor=dark?"#2d5a8e":"#94adc8";
  const mesColor=dark?"#4b7ba8":"#64748b";
  return(
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",display:"block"}}>
      {[0,.25,.5,.75,1].map(f=>{
        const yy=PT+cH*(1-f);
        const v=(maxV*f);
        return<g key={f}>
          <line x1={PL} y1={yy} x2={W-PR} y2={yy} stroke={gridColor} strokeWidth={0.7}/>
          <text x={PL-3} y={yy+4} textAnchor="end" fontSize={11} fill={labelColor}>{v.toFixed(0)}</text>
        </g>;
      })}
      {meses.map((m,mi)=>{
        const cx=PL+mi*grpW+grpW/2;
        return<g key={m}>
          {tipos.map((tipo,ti)=>{
            const val=series[ti].vals[mi];
            if(val===null)return null;
            const x=nTipos===1?cx-barW/2:cx+(ti===0?-barW-1:1);
            const y=toY(val);
            const bh=Math.max(1,toY(0)-y);
            const bc=TCOL[tipo];
            return<g key={tipo}>
              <rect x={x} y={y} width={barW} height={bh} fill={bc} opacity={0.9} rx={3}/>
              <text x={x+barW/2} y={y-5} textAnchor="middle" fontSize={11} fill={bc} fontWeight="bold">{val.toFixed(1)}</text>
            </g>;
          })}
          <text x={cx} y={H-PB+16} textAnchor="middle" fontSize={12} fill={mesColor} fontWeight="600">{MN[m]||m}</text>
        </g>;
      })}
      {tipos.map((tipo,ti)=>(
        <g key={tipo} transform={`translate(${PL+ti*105},${H-PB+28})`}>
          <rect width={12} height={12} fill={TCOL[tipo]} rx={2} opacity={0.9}/>
          <text x={16} y={10.5} fontSize={11.5} fill={dark?"#7db8e8":"#2d5a8e"}>{tipo}</text>
        </g>
      ))}
    </svg>
  );
}

                    <td style={{padding:"5px 10px",fontSize:12,fontWeight:600,color:"var(--text1)",
                      background:bg,border:"1px solid var(--border)",position:"sticky",left:0,zIndex:1,whiteSpace:"nowrap"}}>
                      {KPI_LBL[k]}<span style={{fontSize:9,color:"var(--text4)",marginLeft:3}}>{KPI_UNIT[k]}</span>
                    </td>
                    <td style={{padding:"4px 4px",textAlign:"center",borderRight:"1px solid var(--border)"}}>
                      <span style={{color:"var(--meta)",fontWeight:700,fontSize:12}}>{metas[k]}</span>
                    </td>
                    <td style={{padding:"4px 4px",textAlign:"center",borderRight:"1px solid var(--border)"}}>
                      <Chip val={mtdPv[k]??null} meta={metas[k]} k={k} dark={dark}/>
                    </td>
                    {allDays.map(d=><td key={d} style={{padding:"3px 1px",textAlign:"center",border:"1px solid var(--border)"}}>
                      <Chip val={daily[d]?.[k]??null} meta={metas[k]} k={k} dark={dark}/>
                    </td>)}
                    <td style={{padding:"4px 5px",textAlign:"center",borderLeft:"2px solid ${accentColor}44",
                      background:dark?`${accentColor}11`:`${accentColor}0a`}}>
                      <Chip val={mtd[k]??null} meta={metas[k]} k={k} sz="md" dark={dark}/>
                    </td>
                  </tr>;
                })}
              </tbody>
            </table>
          </div>
        }
      </div>
    );
  }

  // Gráfico para um tipo
  function KpiGrafico({tipo}){
    const{daily}=tipoData(tipo);
    const meta=metas[kpiG];
    const vals=allDays.map(d=>({d,v:daily[d]?.[kpiG]??null}));
    const maxV=Math.max(...vals.map(x=>x.v??0),meta*1.1,0.1);
    const SC2=dark?SC_DARK:SC_LIGHT;
    const H=150;
    const isIns=tipo==="Insourcing";
    const barColor=isIns?"#3b82f6":"#a855f7";
    return(
      <div style={{flex:1,background:"var(--bg1)",border:"1px solid var(--border)",borderRadius:11,padding:"12px 14px"}}>
        <div style={{fontWeight:700,fontSize:12,color:"var(--text1)",marginBottom:10}}>
          <span style={{color:isIns?"#60a5fa":"#c084fc"}}>{tipo}</span>
          <span style={{color:"var(--meta)",fontSize:11,marginLeft:12}}>Meta: {meta} {KPI_UNIT[kpiG]}</span>
        </div>
        {!vals.length?<div style={{color:"var(--text4)",padding:20,fontSize:11}}>Sem dados</div>:(
          <div style={{position:"relative",height:H+20}}>
            <div style={{position:"absolute",left:0,right:0,
              top:H-(meta/maxV)*H,borderTop:"1.5px dashed #d9770666",zIndex:2}}/>
            <div style={{display:"flex",alignItems:"flex-end",height:H,gap:2}}>
              {vals.map(({d,v})=>{
                const s=getStatus(v,meta,kpiG),c=SC2[s];
                const bh=v!=null?Math.max(2,(v/maxV)*H):0;
                return<div key={d} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center"}}
                  title={`${d}: ${fmt(v)}`}>
                  <div style={{width:"100%",height:bh,background:v!=null?barColor:"var(--bg2)",
                    borderRadius:"3px 3px 0 0",opacity:.88}}/>
                  <div style={{fontSize:7,color:"var(--text4)",marginTop:1}}>{parseInt(d.split("-")[2])}</div>
                </div>;
              })}
            </div>
          </div>
        )}
      </div>
    );
  }

  return(
    <div className="fade" style={{display:"flex",flexDirection:"column",flex:1}}>
      {/* sub-controls */}
      <div style={{padding:"10px 18px",background:"var(--bg1)",borderBottom:"1px solid var(--border)",
        display:"flex",gap:9,flexWrap:"wrap",alignItems:"center"}}>
        <select value={polo} onChange={e=>setPolo(e.target.value)}
          style={{background:"var(--tag-bg)",color:"var(--text0)",border:"1px solid var(--border2)",
            borderRadius:7,padding:"5px 11px",fontSize:13,cursor:"pointer"}}>
          <optgroup label="── UTS ──">{UTS.map(p=><option key={p}>{p}</option>)}</optgroup>
          <optgroup label="── UTN ──">{UTN.map(p=><option key={p}>{p}</option>)}</optgroup>
        </select>
        <div style={{display:"flex",gap:2,background:"var(--bg2)",borderRadius:7,padding:2,marginLeft:"auto"}}>
          {[["tabela","📊 Tabela"],["grafico","📈 Gráfico"]].map(([v,l])=>(
            <button key={v} onClick={()=>setView(v)} style={{
              padding:"4px 11px",borderRadius:5,border:"none",cursor:"pointer",
              background:view===v?"var(--bg3)":"transparent",
              color:view===v?"var(--text1)":"var(--text3)",fontSize:12,fontWeight:600}}>
              {l}
            </button>
          ))}
        </div>
      </div>

      {/* content */}
      <div style={{flex:1,overflowX:"auto",overflowY:"auto",padding:"14px 18px"}}>
        {view==="tabela"&&(
          <div>
            <KpiTable tipo="Insourcing"/>
            <div style={{height:1,background:"var(--border)",margin:"8px 0 16px"}}/>
            <KpiTable tipo="Outsourcing"/>
          </div>
        )}
        {view==="grafico"&&(
          <div>
            <div style={{display:"flex",gap:6,marginBottom:14,flexWrap:"wrap"}}>
              {KPI_KEYS.map(k=>(
                <button key={k} onClick={()=>setKpiG(k)} style={{
                  padding:"4px 12px",borderRadius:20,border:`1px solid ${kpiG===k?"var(--accent)":"var(--border)"}`,
                  cursor:"pointer",fontWeight:600,fontSize:12,
                  background:kpiG===k?"var(--accent)":"var(--tag-bg)",color:kpiG===k?"#fff":"var(--text3)"}}>
                  {KPI_LBL[k]}
                </button>
              ))}
            </div>
            <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
              <KpiGrafico tipo="Insourcing"/>
              <KpiGrafico tipo="Outsourcing"/>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ══ TAB REPORT DIÁRIO (print) ══ */
function TabReport({kpiData,metas,selectedMes,processo,dark}){
  const [scope,setScope]=useState("UTS");

  const mesLabel=MN[selectedMes]||selectedMes;

  const SC2=dark?SC_DARK:SC_LIGHT;

  const polos=scope==="UTS"?UTS:UTN;

  const allDays=useMemo(()=>{
    const days=new Set();
    for(const polo of polos)
      for(const tipo of TIPOS)
        Object.keys(kpiData[selectedMes]?.[polo]?.[tipo]?.[processo]?.daily||{}).forEach(d=>days.add(d));
    return[...days].sort();
  },[kpiData,selectedMes,scope,processo]);

  function handlePrint(){
    const el=printRef.current;

    w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"/>

<style>

    setTimeout(()=>w.print(),500);
  }

  return(

              background:scope===s?"var(--accent)":"transparent",

        <span style={{fontSize:12,color:"var(--text3)"}}>

                    const mtd  =kpiData[selectedMes]?.[polo]?.[tipo]?.[processo]?.mtd||{};
                    const mtdPv=kpiData[prevMes]?.[polo]?.[tipo]?.[processo]?.mtd||{};
                    const val=mtd[k]??null, prev=mtdPv[k]??null, meta=metas[k];
                    const diff=(val!==null&&prev!==null)?val-prev:null;
                    const better=diff!==null?(LIB[k]?diff<0:diff>0):null;
                    const s=getStatus(val,meta,k), c=SC2[s];
                    const isPoloFirst = ti===0 && ki===0;

                    const evenPolo = pi%2===0;
                    const bg = evenPolo

                    return(

                          {diff===null?"":better?"🟢":"🔴"}
                        </td>
                      </tr>
                    );
                  })
                )
              )}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}


/* ══ TAB PONTUAÇÃO ══ */
const SCORE_ITEMS = [
  {key:"ativ",    label:"Ativ/Equipe/Dia", meta:15,   max:16.5},
  {key:"eficiencia", label:"Eficiência",   meta:10,   max:11.7},
  {key:"utilizacao", label:"Utilização",   meta:10,   max:11.2},
  {key:"login",   label:"1º Login",        meta:10,   max:13.6},
  {key:"desloc",  label:"1º Deslocamento", meta:10,   max:13.6},
  {key:"retorno", label:"Retorno a Base",  meta:5,    max:7.5},
  {key:"tasktime",label:"Task Time TR",    meta:15,   max:23.33},
  {key:"tmr_sec", label:"TMR Secundário",  meta:15,   max:18.41},
  {key:"tmr_imp", label:"TMR Improd.",     meta:10,   max:13.8},
];
const SCORE_META_TOTAL = 80;
const SCORE_MAX_TOTAL  = 129.64;

function scoreStatus(val, meta, max){
  if(val===null||val===undefined) return "nd";
  if(val>=meta) return "ok";
  if(val>=meta*0.85) return "warn";
  return "bad";
}

function ScoreBar({val, max, color}){
  const pct = val!=null ? Math.min(100, (val/max)*100) : 0;
  return(
    <div style={{height:6,background:"var(--bg3)",borderRadius:3,overflow:"hidden",marginTop:3}}>
      <div style={{height:"100%",width:`${pct}%`,background:color,borderRadius:3,transition:"width .4s"}}/>
    </div>
  );
}

function PontosPoloCard({polo, mes, pontosData, processo, dark}){
  const data = pontosData[mes]?.[polo];
  const SC2 = dark?SC_DARK:SC_LIGHT;
  if(!data || !Object.keys(data).length)
    return(
      <div style={{background:"var(--bg1)",border:"1px solid var(--border)",borderRadius:14,
        padding:"14px 16px",opacity:0.4}}>
        <div style={{fontWeight:700,fontSize:15,color:"var(--text1)",marginBottom:8}}>{polo}</div>
        <div style={{fontSize:12,color:"var(--text4)",fontStyle:"italic"}}>Sem dados</div>
      </div>
    );

  return(
    <div style={{background:"var(--bg1)",border:"1px solid var(--border)",borderRadius:14,overflow:"hidden"}}>
      {/* card header */}
      <div style={{padding:"10px 14px",background:"var(--bg2)",
        borderBottom:"1px solid var(--border)",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <span style={{fontWeight:700,fontSize:15,color:"var(--text1)"}}>{polo}</span>
        <div style={{display:"flex",gap:10}}>
          {["Insourcing","Outsourcing","Polo"].map(tipo=>{
            const d=data[tipo]?.[processo]; if(!d) return null;
            const total=d.total??null;
            const s=scoreStatus(total,SCORE_META_TOTAL,SCORE_MAX_TOTAL);
            const c=SC2[s];
            const isIns=tipo==="Insourcing";
            const isPolo=tipo==="Polo";
            const lblColor=isPolo?"var(--accent)":(isIns?"var(--ins-t)":"var(--out-t)");
            return(
              <div key={tipo} style={{textAlign:"center",...(isPolo?{paddingLeft:10,marginLeft:2,borderLeft:"1px dashed var(--border2)"}:{})}}>
                <div style={{fontSize:9,color:lblColor,fontWeight:700,letterSpacing:".4px"}}>{isPolo?"POLO":tipo.toUpperCase()}</div>
                <div style={{fontSize:22,fontWeight:700,color:c.b,fontFamily:"'IBM Plex Mono',monospace",lineHeight:1}}>{total!=null?total.toFixed(1):"—"}</div>
                <div style={{fontSize:8,color:"var(--text5)"}}>/ {SCORE_META_TOTAL} pts</div>
                <ScoreBar val={total} max={SCORE_MAX_TOTAL} color={c.b}/>
              </div>
            );
          })}
        </div>
      </div>

      {/* score items table */}
      <div style={{padding:"10px 14px"}}>
        <table style={{borderCollapse:"collapse",width:"100%",fontSize:11}}>
          <thead>
            <tr>
              <th style={{padding:"4px 0",textAlign:"left",color:"var(--text3)",fontWeight:700,fontSize:10}}>ITEM</th>
              <th style={{padding:"4px 6px",textAlign:"center",color:"var(--meta)",fontWeight:700,fontSize:10}}>META</th>
              <th style={{padding:"4px 6px",textAlign:"center",color:"var(--meta)",fontWeight:700,fontSize:10}}>MÁX</th>
              {TIPOS.map(tipo=>{
                const isIns=tipo==="Insourcing";
                return(
                  <th key={tipo} style={{padding:"4px 8px",textAlign:"center",fontWeight:700,fontSize:10,
                    color:isIns?"var(--ins-t)":"var(--out-t)"}}>
                    {isIns?"Enel":"Parceira"}
                  </th>
                );
              })}
            </tr>
          </thead>
          <tbody>
            {SCORE_ITEMS.map((item,ki)=>{
              const bg = ki%2===0?"var(--bg0)":"var(--bg1)";
              return(
                <tr key={item.key} style={{background:bg}}>
                  <td style={{padding:"5px 4px",fontWeight:600,color:"var(--text1)",whiteSpace:"nowrap"}}>{item.label}</td>
                  <td style={{padding:"5px 6px",textAlign:"center",color:"var(--meta)",fontWeight:700}}>{item.meta}</td>
                  <td style={{padding:"5px 6px",textAlign:"center",color:"var(--text3)",fontSize:10}}>{item.max}</td>
                  {TIPOS.map(tipo=>{
                    const val=data[tipo]?.[processo]?.[item.key]??null;
                    const s=scoreStatus(val,item.meta,item.max);
                    const c=SC2[s];
                    return(
                      <td key={tipo} style={{padding:"5px 6px",textAlign:"center"}}>
                        {val!=null?(
                          <div>
                            <span style={{display:"inline-block",background:c.b,color:c.t,
                              borderRadius:4,padding:"2px 7px",fontSize:12,fontWeight:700,minWidth:42,textAlign:"center"}}>
                              {val.toFixed(1)}
                            </span>
                            <ScoreBar val={val} max={item.max} color={c.b}/>
                          </div>
                        ):<span style={{color:"var(--text5)"}}>—</span>}
                      </td>
                    );
                  })}
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}
